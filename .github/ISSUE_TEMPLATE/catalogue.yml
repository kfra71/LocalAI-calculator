name: New model or hardware
description: Propose a catalogue entry for data/models.json or data/hardware.json.
title: "[catalogue] "
labels: ["catalogue", "good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer a pull request that edits the JSON directly. Use this issue if you want feedback before opening a PR.

        See [CONTRIBUTING.md](https://github.com/juxhinr/bindwidth/blob/main/CONTRIBUTING.md).
  - type: dropdown
    id: kind
    attributes:
      label: What are you adding?
      options:
        - Model (`data/models.json`)
        - Owned hardware (`data/hardware.json`, kind own)
        - Rental hardware (`data/hardware.json`, kind rent)
        - Serving profile (`data/profiles.json`)
        - Guided-setup scenario (`data/scenarios.json`)
    validations:
      required: true
  - type: input
    id: label
    attributes:
      label: Proposed name / label
      placeholder: 4x H200 - OVHcloud (EU)
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: Key numbers
      description: For models — totalB, activeB, bytesPerParam, kvKbPerToken, specTokens. For hardware — memGb, bandwidth, price/hourly, efficiency, batching, precisions.
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - measured
        - published
        - community
        - list-price
        - aggregator
        - estimated
        - derived
        - kv-derived
        - template
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources / derivation
      description: Vendor page, recipe, measured run, or how you derived the figure. Optimistic efficiency without evidence will be rejected.
    validations:
      required: true
  - type: textarea
    id: draft
    attributes:
      label: Draft JSON (optional)
      description: Paste a draft object if you already have one.
      render: json
